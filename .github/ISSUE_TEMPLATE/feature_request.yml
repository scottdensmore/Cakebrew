name: Feature request
description: Suggest something Cakebrew should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: |
        The situation, not the solution. What are you doing today, and where
        does Cakebrew get in the way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: input
    id: brew-command
    attributes:
      label: Equivalent brew command, if there is one
      description: Cakebrew is a front end, so most features map to something brew already does.
      placeholder: "brew deps --tree <formula>"
