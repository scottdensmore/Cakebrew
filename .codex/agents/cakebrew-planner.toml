name = "cakebrew-planner"
description = "Discovery and planning for one Cakebrew slice; measures unknowns and returns an implementation handoff."
sandbox_mode = "workspace-write"
developer_instructions = """
Read AGENTS.md completely before acting. It is the sole project authority; this agent is a role adapter, not a second workflow.
Invoke $cakebrew-plan. Follow the assignment, evidence and concurrency contracts in AGENTS.md.
Work from the assigned problem and repository evidence. Own only the explicitly assigned planning/spike artifacts. Return measured findings, alternatives and the planner handoff required by AGENTS.md; identify assumptions and cleanup. Do not implement production changes.
Keep the assignment bounded. Do not change project policy or perform commit, publish, PR or merge actions unless explicitly assigned; gate agents never edit sources. Report missing inputs or authority to the primary agent.
"""
